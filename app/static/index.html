<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模块边界庭</title>
<style>
:root{color-scheme:dark;background:#020617;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}body{margin:0;color:#dbeafe}header{padding:16px 20px;border-bottom:1px solid #1e293b;background:#0f172a;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0 0 6px}.muted{color:#94a3b8}.wrap{display:grid;grid-template-columns:370px 1fr;gap:14px;padding:14px}button{background:#2563eb;color:white;border:0;border-radius:7px;padding:7px 10px;margin:3px;cursor:pointer}button.secondary{background:#334155}button.good{background:#059669}button.bad{background:#dc2626}textarea,input,select{width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:7px;padding:8px}textarea{min-height:82px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #1e293b;padding:6px;text-align:left;vertical-align:top}th{color:#93c5fd}.pill{display:inline-block;padding:2px 6px;border-radius:99px;background:#1e293b;margin:2px}.accepted{color:#86efac}.rejected{color:#fca5a5}.candidate{color:#fde68a}.unknown{color:#c4b5fd}.timeline{max-height:310px;overflow:auto}.sid{color:#7dd3fc;word-break:break-all}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:#1e293b}.tabs button.active{background:#2563eb}.panel{display:none}.panel.active{display:block}.finding{border:1px solid #334155;border-radius:9px;padding:8px;margin:7px 0}.kv{color:#cbd5e1}.json{white-space:pre-wrap;overflow:auto;max-height:260px;background:#020617;border-radius:8px;padding:8px}.map{width:100%;overflow:auto;border:1px solid #1e293b;border-radius:8px;background:#0f172a}.small{font-size:12px}
</style></head><body>
<header><h1>模块边界庭：WebAssembly 段索引、类型栈与提案能力验证</h1><div class="muted">不可变输入 · 父子版本 · 算法/参数/直接来源指纹 · 候选与拒绝原因一等保留 · 虚拟时间可重放</div></header>
<div class="wrap"><aside>
<div class="card"><b>1. 连续工作流</b><p class="muted small">安装仓库案例后，沿事件线逐版查看；接受、否定、调参和冲突撤销都会形成新事件。</p><button onclick="installCase()">安装离线案例</button><button class="secondary" onclick="loadProjects()">刷新项目</button><div id="projects"></div></div>
<div class="card"><b>2. 导入运行时材料</b><p class="muted small">接受 hex Wasm binary、proposal 集合与 host import JSON。</p><input id="title" placeholder="项目标题" value="运行时导入复核"><textarea id="binary" placeholder="Wasm hex"></textarea><textarea id="proposals" placeholder='{"multi_value":false,...}'>{"multi_value":false,"reference_types":false,"sign_extension":false,"bulk_memory":false}</textarea><textarea id="hosts" placeholder='{"imports":[]}'>{"imports":[]}</textarea><button onclick="submitBinary()">提交不可变输入</button></div>
<div class="card"><b>3. 参数修订</b><textarea id="newParams" placeholder='{"proposals":{},"host_imports":{"imports":[]}}'></textarea><button onclick="reviseParams()">生成参数新版本</button></div>
<div class="card"><b>4. 裁定与历史</b><input id="findingId" placeholder="finding stable identity"><input id="rationale" placeholder="裁定理由"><button class="good" onclick="decide('accepted')">接受候选</button><button class="bad" onclick="decide('rejected')">否定候选</button><button class="secondary" onclick="conflict()">记录冲突决定</button><button class="secondary" onclick="undoDecision()">撤销上一决定</button><button onclick="exportProject()">导出档案</button><input id="importArchive" placeholder="粘贴导出 JSON"><button class="secondary" onclick="importArchive()">删除库后重导</button></div>
</aside><main>
<div class="card"><div id="headline" class="muted">请安装或导入项目。</div><div class="timeline" id="timeline"></div></div>
<div class="card tabs"><button class="active" data-tab="map" onclick="showTab('map')">Section 地图</button><button data-tab="index" onclick="showTab('index')">索引表</button><button data-tab="stack" onclick="showTab('stack')">控制栈/类型转移</button><button data-tab="findings" onclick="showTab('findings')">候选与最小字节范围</button><button data-tab="sources" onclick="showTab('sources')">来源/指纹/原始表示</button></div>
<div id="map" class="panel active card"><div class="map" id="svgHost"></div><div id="sections"></div></div>
<div id="index" class="panel card"><div class="grid"><div><h3>索引空间</h3><div id="indices"></div></div><div><h3>LEB128 / import 契约</h3><div id="leb"></div><div id="contract"></div></div></div></div>
<div id="stack" class="panel card"><div id="funcs"></div></div>
<div id="findings" class="panel card" id="findingsPanel"><div id="findingList"></div></div>
<div id="sources" class="panel card"><div id="raw"></div></div>
</main></div><script>
let state=null, tab='map'; const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function json(x){return JSON.stringify(x,null,2)}
async function api(url,opt){const r=await fetch(url,opt); if(!r.ok)throw new Error(await r.text()); return r.json()}
function showProjects(ps){$('projects').innerHTML=ps.map(p=>`<div class="finding"><button onclick="openProject('${p.project_id}')">打开</button> <span class="sid">${esc(p.title)}<br>${esc(p.project_id)}</span></div>`).join('')}
async function loadProjects(){showProjects(await api('/api/projects'))}
async function installCase(){try{render(await api('/api/cases/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}));await loadProjects()}catch(e){alert(e.message)}}
function parseTextarea(id){try{return JSON.parse($(id).value)}catch(e){alert(id+' JSON 无效: '+e.message);throw e}}
async function submitBinary(){let proposals=parseTextarea('proposals'), host_imports=parseTextarea('hosts');let body={title:$('title').value,binary_hex:$('binary').value.trim().replace(/\s+/g,''),proposals,host_imports};render(await api('/api/import-binary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}));await loadProjects()}
async function openProject(id){render(await api(`/api/projects/${id}/review`))}
async function reviseProjects(id){render(await api(`/api/projects/${id}/review?revision_id=${id}`))}
async function reviseParams(){let p=parseTextarea('newParams');let body={proposals:p.proposals||{},host_imports:p.host_imports||{imports:[]},label:p.label||'页面参数修订',rationale:p.rationale||'reviewer adjusted proposal or host contract'};render(await api(`/api/projects/${state.project.project_id}/revisions/params`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))}
async function decide(decision){let body={finding_id:$('findingId').value,decision,rationale:$('rationale').value||'manual review decision'};render(await api(`/api/projects/${state.project.project_id}/decisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))}
async function conflict(){let last=state.events.filter(e=>e.kind.startsWith('decision')).pop();let body={finding_id:$('findingId').value,decision:'rejected',rationale:'conflicting human decision retained for audit',conflict_with:last?last.event_id:null};render(await api(`/api/projects/${state.project.project_id}/decisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))}
async function undoDecision(){let last=state.events.filter(e=>e.kind.startsWith('decision')).pop();if(!last)return alert('没有可撤销决定');let fid=last.payload.note&&last.payload.note.finding_id||$('findingId').value;let body={finding_id:fid,decision:'rejected',rationale:'undo prior decision as a new historical event',undo_of:last.event_id};render(await api(`/api/projects/${state.project.project_id}/decisions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))}
async function exportProject(){let data=await api(`/api/projects/${state.project.project_id}/export`);$('importArchive').value=JSON.stringify(data);location.href=`/api/projects/${state.project.project_id}/export`}
async function importArchive(){let data=JSON.parse($('importArchive').value);render(await api('/api/projects/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}));await loadProjects()}
function showTab(name){tab=name;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===name))}
async function openRevision(rid){render(await api(`/api/projects/${state.project.project_id}/review?revision_id=${rid}`))}
function render(s){state=s; $('headline').innerHTML=`<b>${esc(s.project.title)}</b> <span class="pill">rev ${s.revision.ordinal}</span><span class="pill">${esc(s.revision.label)}</span><span class="pill">${esc(s.revision.kind)}</span><br><span class="sid">project:${esc(s.project.project_id)}<br>revision:${esc(s.revision.revision_id)}</span>`;
$('timeline').innerHTML=s.events.map((e,i)=>`<button class="secondary small" onclick="openRevision('${e.revision_id}')">R${i} ${esc(e.kind)}</button>`).join(' ');
$('svgHost').innerHTML=`<img alt="section map" src="/api/revisions/${s.revision.revision_id}/section-map.svg" style="width:100%">`;
$('sections').innerHTML=table(['stable identity','section','id/size','payload','raw range','custom'],s.sections.map(a=>({id:a.artifact_id,d:a.data})).map(x=>[x.id,x.d.name,`${x.d.section_id} / ${x.d.size_value}`,`[${x.d.payload_start},${x.d.payload_end})`,`[${x.d.start},${x.d.end})`,x.d.custom_name||'']));
$('indices').innerHTML=table(['stable identity','kind','index','source','detail'],s.indices.map(a=>[a.artifact_id,a.data.kind,a.data.index,a.data.source_id,json(a.data.detail)]));
$('leb').innerHTML=table(['identity','value','bytes','canonical','overflow','span'],s.leb128.map(a=>[a.artifact_id,a.data.value,a.data.raw.map(b=>b.toString(16).padStart(2,'0')).join(' '),a.data.canonical,a.data.overflow,`[${a.data.start},${a.data.end})`]));
$('contract').innerHTML=table(['identity','module.name','desc'],s.artifacts.filter(a=>a.kind==='import_contract').map(a=>[a.artifact_id,`${a.data.module}.${a.data.name}`,json(a.data.desc)]));
$('funcs').innerHTML=s.function_validations.map(a=>{let d=a.data;return `<div class="finding"><b>function ${d.function_index}</b> type ${d.type_index} <span class="sid">${esc(a.artifact_id)}</span><p>params ${esc(d.params.join(','))} → results ${esc(d.results.join(','))}; locals ${esc(d.locals.join(','))}</p><h4>控制栈</h4>${table(['event','kind','span'],d.control_stack.map(c=>[c.event,c.kind,json(c.span||{start:c.start})]))}<h4>类型转移</h4>${table(['instr','input','output','poly?','after','span','identity'],d.type_transfers.map(t=>[t.name,json(t.input),json(t.output),t.polymorphic,json(t.stack_after),`[${t.span.start},${t.span.end})`,t.stable_id]))}</div>`}).join('') || '<p class="muted">无函数体。</p>';
$('findingList').innerHTML=s.findings.map(a=>{let d=a.data;return `<div class="finding"><span class="pill ${esc(a.status)}">${esc(a.status)}</span><b>${esc(d.code)}</b><p>${esc(d.message)}</p><p class="small">identity: <span class="sid">${esc(a.artifact_id)}</span><br>minimum span: <b>[${d.minimum_failure_span.start},${d.minimum_failure_span.end})</b> source=${esc(d.source_id)}</p><details><summary>机器判断依据 / 候选 / 直接来源</summary><div class="json">${esc(json({classification:d.classification,candidates:d.candidates,evidence:d.evidence,dependencies:a.dependencies}))}</div></details><button onclick="$('findingId').value='${a.artifact_id}'">用此身份裁定</button></div>`}).join('') || '<p class="accepted">当前版本没有 finding。</p>';
$('raw').innerHTML=table(['field','value'],[['byte_length',s.input.byte_length],['parameter_fingerprint',s.revision.parameter_fingerprint],['source_fingerprint',s.revision.source_fingerprint],['algorithm_version',s.artifacts[0]?.algorithm_version],['parent_revision',s.revision.parent_revision_id],['binary_hex',s.input.binary_hex],['params',json(s.input.params)]])}
function table(cols,rows){return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
loadProjects();
if(location.hash) openProject(location.hash.slice(1));
</script></body></html>
